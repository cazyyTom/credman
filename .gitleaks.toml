# Gitleaks config: the built-in rules plus the leak this repo actually had.
# The default ruleset does NOT flag a password inside a database URI such as
# postgresql://user:<password>@host/db, so it is added here.

[extend]
useDefault = true

[[rules]]
id = "connection-string-password"
description = "Password embedded in a database connection URI"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqps?)://[^:@/\s'"]+:([^@/\s'"]{8,})@'''
secretGroup = 1
keywords = ["://"]

  [[rules.allowlists]]
  description = "Placeholders and CI-only throwaway values"
  regexes = ['''^(?:change-me|ci-only-not-a-secret|\*+|\$\{[^}]+\}|<[^>]+>)$''']

[[rules]]
id = "postgres-password-literal"
description = "Literal POSTGRES_PASSWORD in compose/env/CI files"
regex = '''(?m)(?:^|[\s"'-])POSTGRES_PASSWORD["']?\s*[:=]\s*["']?([^\s"'$#?{}]{8,})'''
secretGroup = 1
keywords = ["postgres_password"]

  [[rules.allowlists]]
  description = "Placeholders and CI-only throwaway values"
  regexes = ['''^(?:change-me|ci-only-not-a-secret|\*+)$''']

[allowlist]
description = "Build output and vendored environments"
paths = ['''(?:^|/)\.next/''', '''(?:^|/)node_modules/''', '''(?:^|/)venv/''']

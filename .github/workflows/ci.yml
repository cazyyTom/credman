name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: credman
          # CI-ONLY throwaway password. This database exists only for the
          # lifetime of the job and is unreachable outside the runner.
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: credman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credman -d credman"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI-ONLY: matches the throwaway service container above.
      DATABASE_URL: postgresql://credman:ci-only-not-a-secret@localhost:5432/credman
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest
